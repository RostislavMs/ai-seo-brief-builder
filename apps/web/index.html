<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Значення підмінює lib/theme.ts при перемиканні теми: воно має
         відповідати вибору користувача, а не темі операційної системи. -->
    <meta name="theme-color" content="#fbfaf8" />
    <meta
      name="description"
      content="Аналіз сторінок конкурентів за URL і генерація SEO ТЗ на статтю."
    />
    <!-- Іконка вбудована як data URI: інакше браузер робить запит
         за /favicon.ico і отримує 404 у консолі. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235b51d1'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='bold' text-anchor='middle' fill='%23ffffff'%3EAI%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=swap: текст показується системним шрифтом одразу, а не після
         завантаження Inter. Офлайн застосунок просто лишається на системному
         стеку з --font-sans. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=JetBrains+Mono:wght@400..500&display=swap"
    />

    <title>AI SEO Brief Builder</title>

    <script>
      /*
       * Тема застосовується до першого кадру й навмисно синхронним скриптом:
       * якщо чекати на React, при кожному перезавантаженні світла тема
       * встигає блимнути перед темною.
       *
       * Ключ і формат (JSON) мусять збігатися з lib/theme.ts.
       */
      (function () {
        var preference = "system";

        try {
          var raw = window.localStorage.getItem("brief.theme");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed === "light" || parsed === "dark" || parsed === "system") {
              preference = parsed;
            }
          }
        } catch (error) {
          /* приватний режим або вимкнені куки — лишаємо system */
        }

        var dark =
          preference === "dark" ||
          (preference === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);

        var root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#1a1917" : "#fbfaf8");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
